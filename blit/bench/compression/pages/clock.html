<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0}
#screen{width:716px;height:480px;box-sizing:border-box;background:#fff;color:#000;font-family:"DejaVu Sans Mono",monospace;padding:32px 40px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.date{justify-self:start;background:#000;color:#fff;border-radius:999px;padding:3px 12px;font-size:15px}
.time{align-self:center;font-size:136px;letter-spacing:-0.05em;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;border-top:2px solid #000;padding-top:14px}
.label{font-size:13px;letter-spacing:.08em;text-transform:uppercase}.value{font-size:22px;font-weight:500}
.bar{position:relative;height:10px;border:2px solid #000;border-radius:999px;margin-top:6px}
.bar::before{content:"";position:absolute;inset:0;width:var(--pct);background:#000;border-radius:999px}
</style></head><body><div id="screen"><div class="date">MONDAY 28 SEPTEMBER</div>
<div class="time" id="t">12:34</div>
<div class="stats"><div><div class="label">Day</div><div class="value">52%</div><div class="bar" style="--pct:52%"></div></div>
<div><div class="label">Week</div><div class="value">7%</div><div class="bar" style="--pct:7%"></div></div>
<div><div class="label">Year</div><div class="value">74%</div><div class="bar" style="--pct:74%"></div></div></div></div>
<script>const q=new URLSearchParams(location.search);if(q.get('t'))document.getElementById('t').textContent=q.get('t');</script></body></html>
