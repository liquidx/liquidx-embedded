; M5StickS3 shell firmware: the Xteink X4 shell (../xteink-x4-platformio),
; redrawn for a 240x135 colour LCD and two keys, on M5Unified.
;
;   pio run -t upload          flash the M5StickS3                 <- default
;   pio run -e sim             build the screen renderer for this computer
;                              (scripts/sim.sh builds, runs and writes PNGs)

[platformio]
default_envs = sticks3

[env]
extra_scripts = pre:scripts/version.py

; --- M5StickS3: ESP32-S3-PICO-1-N8R8, 8MB flash / 8MB octal PSRAM -------------
; The same pioarduino platform as the X4, so blit and blat build against the
; same Arduino core and NimBLE.
[env:sticks3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
monitor_speed = 115200

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  ; BLE (src/ble): blit and blat on NimBLE, as a single-connection peripheral.
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
build_unflags =
  -std=gnu++11

lib_deps =
  m5stack/M5Unified@^0.2.17
  h2zero/NimBLE-Arduino@^2.3.8
  ; blit (frames over BLE) and blat (settings over BLE): the shared libraries
  ; at the repo root.
  blit=symlink://../blit/firmware
  blat=symlink://../blat/firmware

lib_ignore =
  BLE

; --- The screens, rendered on this computer -----------------------------------
; The shell, widgets and apps drawing into the same M5GFX sprite as on the
; device, with the board and the radio stubbed (sim/). Needs SDL2 for M5GFX's
; desktop build (brew install sdl2); no window is opened.
[env:sim]
platform = native
build_flags =
  -std=gnu++2a
  -O1
  -Isrc
  -I../blit/firmware/src
  -I../blat/firmware/src
  !sdl2-config --cflags --libs
lib_deps =
  m5stack/M5GFX@^0.2.24
lib_compat_mode = off
build_src_filter =
  +<Fonts.cpp>
  +<Settings.cpp>
  +<apps/>
  +<shell/Shell.cpp>
  +<ui/>
  +<../sim/>
  +<../../blit/firmware/src/blit/Frame.cpp>
  +<../../blit/firmware/src/blit/Receiver.cpp>
  +<../../blit/firmware/src/blit/Wire.cpp>
  +<../../blat/firmware/src/blat/Values.cpp>
  +<../../blat/firmware/src/blat/Wire.cpp>
